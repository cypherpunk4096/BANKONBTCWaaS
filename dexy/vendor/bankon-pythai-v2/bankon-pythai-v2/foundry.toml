[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.22"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./config" }]

# ---------------------------------------------------------------------------
# BANKON PYTHAI v2 — cypherpunk2048 standard
#   - mainnet-only deployment (no testnets in CI/scripts)
#   - Foundry for all testing (forge test, forge script --broadcast)
#   - no upgradeable proxies, no admin keys post-handoff to DAIO
# ---------------------------------------------------------------------------

[rpc_endpoints]
ethereum   = "${ETHEREUM_MAINNET_RPC}"
arbitrum   = "${ARBITRUM_MAINNET_RPC}"
optimism   = "${OPTIMISM_MAINNET_RPC}"
base       = "${BASE_MAINNET_RPC}"
bnb        = "${BNB_MAINNET_RPC}"
polygon    = "${POLYGON_MAINNET_RPC}"

[etherscan]
ethereum = { key = "${ETHERSCAN_API_KEY}" }
arbitrum = { key = "${ARBISCAN_API_KEY}" }
optimism = { key = "${OPTIMISM_ETHERSCAN_API_KEY}" }
base     = { key = "${BASESCAN_API_KEY}" }
bnb      = { key = "${BSCSCAN_API_KEY}" }
polygon  = { key = "${POLYGONSCAN_API_KEY}" }

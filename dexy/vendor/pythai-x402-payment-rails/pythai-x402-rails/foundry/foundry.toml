[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
cache_path = "cache"
solc_version = "0.8.20"
evm_version = "paris"

# Compiler settings
optimizer = true
optimizer_runs = 200
via_ir = true

# Linker settings
link_references = true
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/contracts/",
    "@chainlink/=lib/chainlink/contracts/",
]

# Testing
gas_limit = 30000000
gas_price = 1000000000
tx_origin = "0x0000000000000000000000000000000000000000"
initial_balance = "0xffffffffffffffffffffffffffffffff"

[profile.test]
# Override for testing
gas_limit = 30000000
fuzz_runs = 1000
fuzz_seed = 0x4242
invariant_runs = 100

[profile.production]
# Settings for mainnet deployments
optimizer_runs = 100000
via_ir = true

[rpc_endpoints]
ethereum = "https://eth.llamarpc.com"
ethereum-sepolia = "https://sepolia.infura.io/v3/$INFURA_KEY"
arbitrum = "https://arb1.arbitrum.io/rpc"
polygon = "https://polygon-rpc.com"
algorand-mainnet = "https://mainnet-api.algonode.cloud"
zero-g-aristotle = "https://aristotle-rpc.zerogwei.com"

[etherscan]
ethereum = { key = "${ETHERSCAN_API_KEY}" }
arbitrum = { key = "${ARBISCAN_API_KEY}" }
polygon = { key = "${POLYGONSCAN_API_KEY}" }

[fmt]
line_length = 100
tab_width = 4
quote_style = "double"
bracket_spacing = true

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BANKON Console — Bitcoin Core diagnostics</title>
<style>
  :root { color-scheme: dark;
    --btc:#F7931A;   /* Bitcoin orange — primary */
    --poly:#8247E5;  /* Polygon purple */
    --eth:#627EEA;   /* Ethereum blue */
    --cash:#0AC18E;  /* Cash green — success */
    --cardano:#0033AD; /* Cardano blue — hover */
    --solana:#9945FF;  /* Solana royal */
    --bankon:#1C66C9;  /* BANKON blue — corporate brand */
    --grey:#8B949E;    /* BANKON grey — corporate secondary */
  } * { box-sizing: border-box; }
  button:hover, .seg button:hover { border-color:var(--cardano); }
  button.tab:hover { color:var(--cardano); }
  body { font: 14px/1.5 system-ui, sans-serif; margin:0; background:#0e1116; color:#e6edf3; }
  header { display:flex; align-items:center; gap:.7rem; padding:.6rem 1rem; background:#131a24; border-bottom:2px solid var(--bankon); position:sticky; top:0; z-index:6; flex-wrap:wrap; }
  header h1 { font-size:1.05rem; margin:0; color:var(--btc); background:var(--bankon); padding:.2rem .6rem; border-radius:6px; font-weight:700; letter-spacing:.02em; } .sub{ color:var(--grey); font-size:.8rem; }
  select, button, input { font:inherit; padding:.35rem .55rem; border-radius:7px; border:1px solid #30363d; background:#0d1117; color:#e6edf3; }
  button { cursor:pointer; }
  .seg { display:inline-flex; border:1px solid #30363d; border-radius:7px; overflow:hidden; }
  .seg button { border:none; border-radius:0; background:#0d1117; color:#7d8590; padding:.35rem .7rem; }
  .seg button.on { background:var(--poly); color:#fff; }
  a.waas { background:var(--btc); border:1px solid var(--btc); color:#1a1200; padding:.4rem .7rem; border-radius:7px; text-decoration:none; font-weight:700; }
  a.waas:hover { background:var(--cardano); border-color:var(--cardano); color:#fff; }
  nav { display:flex; gap:.1rem; padding:0 1rem; background:#161b22; border-bottom:1px solid #30363d; overflow-x:auto; position:sticky; top:50px; z-index:5; }
  button.tab { border:none; background:none; padding:.55rem .85rem; color:#7d8590; border-bottom:2px solid transparent; white-space:nowrap; }
  button.tab.active { color:#e6edf3; border-bottom-color:var(--btc); }
  main { padding:1rem; max-width:1100px; margin:0 auto; }
  .panel { display:none; } .panel.active { display:block; }
  .coremon { display:inline-flex; align-items:center; gap:.3rem; margin-left:.45rem; padding:.12rem .5rem;
    border-radius:7px; font-weight:800; font-size:.74rem; letter-spacing:.5px; border:2px solid transparent; transition:box-shadow .3s; }
  .coremon.on  { color:#F7931A; }                                  /* Bitcoin Orange = ON */
  .coremon.off { color:#f85149; }                                  /* red = OFF */
  .coremon.feeding { border-color:#16C784; box-shadow:0 0 9px #16C78488; }  /* green surround = connecting/feeding */
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:.7rem; }
  .card { background:#161b22; border:1px solid #30363d; border-radius:10px; padding:.7rem .8rem; }
  .card .k { color:#7d8590; font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; }
  .card .v { font-size:1.2rem; font-weight:600; margin-top:.15rem; word-break:break-all; } .card .v.sm{font-size:.92rem;font-weight:500;}
  table { width:100%; border-collapse:collapse; font-size:.82rem; } th,td { text-align:left; padding:.35rem .5rem; border-bottom:1px solid #21262d; white-space:nowrap; }
  th { color:#7d8590; position:sticky; top:0; background:#0e1116; }
  .scroll { overflow:auto; max-height:60vh; border:1px solid #30363d; border-radius:10px; }
  .progress { height:26px; background:#0d1117; border:1px solid #30363d; border-radius:8px; overflow:hidden; }
  .progress > div { height:100%; background:linear-gradient(90deg,var(--btc),var(--cash)); display:flex; align-items:center; padding-left:.5rem; font-size:.78rem; font-weight:600; color:#001; white-space:nowrap; }
  .row { display:flex; align-items:center; gap:.5rem; margin:.2rem 0; } .row .lbl{ width:150px; color:#7d8590; font-size:.78rem; text-align:right; font-family:ui-monospace,monospace;}
  .row .track{ flex:1; background:#0d1117; border-radius:4px; overflow:hidden;} .bar{ height:18px; background:var(--btc); border-radius:4px;}
  details { border:1px solid #30363d; border-radius:9px; margin:.5rem 0; background:#0d1117; }
  details[open] { border-color:var(--solana); } summary { cursor:pointer; padding:.5rem .75rem; font-weight:600; list-style:none; display:flex; justify-content:space-between; align-items:center; }
  summary::-webkit-details-marker{display:none;} summary::after{content:'＋';color:#7d8590;font-weight:400;} details[open] summary::after{content:'－';}
  .body { padding:.2rem .8rem .7rem; } pre{ font-family:ui-monospace,monospace; background:#010409; padding:.7rem; border-radius:8px; overflow:auto; max-height:50vh; font-size:.78rem; }
  code{font-family:ui-monospace,monospace; color:var(--eth);} .muted{color:#7d8590;} .ok{color:var(--cash);} .warn{color:#e3b341;} .err{color:#f85149;}
  h3{margin:1.1rem 0 .5rem; font-size:.95rem;} .pill{display:inline-block;padding:.05rem .5rem;border-radius:999px;font-size:.72rem;background:#101d33;color:var(--eth);}
  .nodestat{font-size:.8rem;padding:.1rem .55rem;border-radius:999px;border:1px solid #30363d;white-space:nowrap}
  .nodestat.running{color:var(--cash);border-color:#0c2e23;background:#06140f}
  .nodestat.booting,.nodestat.busy{color:var(--btc);border-color:#3a2d10;background:#1c1710}
  .nodestat.down{color:#f85149;border-color:#3a1414;background:#1c1010}
  .logpane{font-family:ui-monospace,monospace;font-size:.82rem;line-height:1.45;background:#010409;border:2px solid var(--btc);border-radius:8px;padding:.7rem .8rem;max-height:52vh;overflow:auto;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
  .logpane::selection,.logpane *::selection{background:#00BFFF;color:#001018}
  .logpane .u{color:var(--cash)}.logpane .i{color:var(--eth)}.logpane .w{color:#e3b341}
  .logpane mark{background:var(--btc);color:#001;border-radius:2px;padding:0 1px}
  button.danger{background:#a4242b;border-color:#a4242b;color:#fff}
  .hero{ background:linear-gradient(135deg,#10241a,#0d1726); border:1px solid #238636; border-radius:14px; padding:1.4rem; text-align:center; }
  .hero a.waas{ font-size:1.05rem; padding:.7rem 1.4rem; display:inline-block; margin-top:.6rem; }
  .mrow{ display:flex; gap:.5rem; align-items:center; padding:.3rem 0; border-bottom:1px solid #21262d; flex-wrap:wrap; }
  .mrow code{ min-width:190px; } .mrow .d{ color:#7d8590; flex:1; font-size:.82rem; }
</style>
</head>
<body>
<header>
  <h1>BANKON Console</h1><span class="sub">the agnostic face of Bitcoin Core · read-only diagnostics</span>
  <span id="nodestat" class="nodestat" title="Bitcoin Core node status">● checking…</span>
  <span id="coremon" class="coremon off" title="Bitcoin Core monitor — orange ON · red OFF · green ring = connecting/feeding">● CORE</span>
  <span id="sysmon" class="sub" title="host CPU · temperature · memory" style="margin-left:.4rem">🖥 —</span>
  <span style="margin-left:auto"></span>
  <span class="sub">detail</span>
  <span class="seg" id="lvl"><button data-l="0" class="on">Basic</button><button data-l="1">Detailed</button><button data-l="2">Expert</button></span>
  <span class="sub">node</span>
  <select id="node"><option value="full">full :8332</option><option value="pruned">pruned :8342</option></select>
  <button id="refresh" title="refresh now">↻</button>
  <span id="refreshed" class="sub" title="last UI refresh (clock)">—</span>
  <label class="sub">refresh
    <select id="rate">
      <option value="0">off</option>
      <option value="10000">10s</option>
      <option value="30000" selected>30s</option>
      <option value="60000">1 min</option>
      <option value="300000">5 min</option>
    </select>
  </label>
  <a class="waas" href="http://127.0.0.1:8088" target="_blank" rel="noopener">+ Create Wallet</a>
</header>
<nav id="tabs"></nav>
<main>
  <div class="panel active" id="p-overview"></div>
  <div class="panel" id="p-blocks"></div>
  <div class="panel" id="p-mempool"></div>
  <div class="panel" id="p-network"></div>
  <div class="panel" id="p-indexes"></div>
  <div class="panel" id="p-oracle"></div>
  <div class="panel" id="p-wallets"></div>
  <div class="panel" id="p-create"></div>
  <div class="panel" id="p-ordinals"></div>
  <div class="panel" id="p-reference"></div>
  <div class="panel" id="p-node"></div>
  <div class="panel" id="p-logs"></div>
  <div class="panel" id="p-console"></div>
  <div class="panel" id="p-monitor"></div>
</main>
<script type="module">
const TABS=[['overview','Overview'],['node','Node'],['logs','Logs'],['blocks','Blocks'],['mempool','Mempool'],['network','Network'],['indexes','Indexes'],['oracle','BTC.oracle'],['wallets','Wallets'],['create','Create Wallet'],['ordinals','🜚 Ordinals'],['reference','Reference'],['console','RPC Console'],['monitor','Monitor']];
const $=s=>document.querySelector(s); let cur='overview', level=0, timer=null;
let lastSyncHeight=null;   // for "+N blocks since last refresh"
const IDX={tip:0,t:0,tx:0,rate:0,spin:0,first:0,txt:''};   // Indexes "crunching" state
const OMEAS={rows:[],seen:new Set(),primed:false};         // BTC.oracle auto-measure (new-block stream)
const nav=$('#tabs'); TABS.forEach(([id,label],i)=>{const b=document.createElement('button');b.className='tab'+(i===0?' active':'');b.textContent=label;b.onclick=()=>select(id,b);nav.appendChild(b);});
$('#lvl').querySelectorAll('button').forEach(b=>b.onclick=()=>{level=+b.dataset.l;$('#lvl').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));render();});
const node=()=>$('#node').value;
async function rpc(method,params=[],wallet=null){const r=await fetch('/api/rpc',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({node:node(),method,params,wallet})}).then(r=>r.json());if(!r.ok)throw new Error(r.error);return r.result;}
const fmt=n=>n==null?'—':Number(n).toLocaleString(); const gib=b=>b==null?'—':(b/1073741824).toFixed(1)+' GB';
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const card=(k,v,sm)=>`<div class="card"><div class="k">${k}</div><div class="v ${sm?'sm':''}">${v}</div></div>`;
// ---- peer diagnostics (browser topology) — mirrors the Qt peer_diag_lines surface ----
const _dur=s=>{s=Math.max(0,s|0);const h=s/3600|0,m=(s%3600)/60|0;return h?`${h}h ${m}m`:(m?`${m}m ${s%60}s`:`${s}s`);};
function peerDiag(p){const now=Date.now()/1000,age=now-(p.conntime||now);const recv=p.bytesrecv||0,sent=p.bytessent||0;
  const svc=Array.isArray(p.servicesnames)&&p.servicesnames.length?p.servicesnames.join(', '):(p.services||'—');
  return [['address',p.addr||'—'],['local / bind',p.addrlocal||p.addrbind||'—'],['network',p.network||'—'],
    ['direction',p.inbound?'↓ inbound':'↑ outbound'],['conn type',p.connection_type||'—'],['client',(p.subver||'').replace(/\//g,'')||'—'],
    ['protocol',p.version??'—'],['services',svc],['relays txs',p.relaytxes?'yes':'no'],
    ['ping now/min',`${((p.pingtime||0)*1000).toFixed(0)} / ${((p.minping||0)*1000).toFixed(0)} ms`],
    ['↓ recv rate',(recv/Math.max(1,age)/1024).toFixed(1)+' KB/s'],['↓ received',(recv/1048576).toFixed(2)+' MiB'],
    ['↑ sent',(sent/1048576).toFixed(2)+' MiB'],['connected for',_dur(age)],['their blocks',p.synced_blocks??'—'],
    ['their headers',p.synced_headers??'—'],['starting ht',p.startingheight??'—'],['blocks in-flight',(p.inflight||[]).length],
    ['manual (addnode)',p.addnode?'yes':'no']];}
// EtherApe-style traffic spectrum: blue (idle) → green (busy) → orange (hot).
function topoColor(f){f=Math.max(0,Math.min(1,f)); if(f<0.5){const t=f/0.5;return `rgb(${0+t*22|0},${191+t*8|0},${255-t*123|0})`;} const t=(f-0.5)/0.5;return `rgb(${22+t*225|0},${199-t*52|0},${132-t*106|0})`;}
// Sync gauge color: <51% dark; 51%→99% dark green → lighter; ≥99% candle green (held to 100%).
const CANDLE='#16C784';
function syncColor(p){
  if(p>=99) return CANDLE;
  if(p<51) return '#0a3d27';
  const t=(p-51)/48, L=(a,b)=>Math.round(a+(b-a)*t);
  return `rgb(${L(11,22)},${L(93,199)},${L(52,132)})`;   // #0b5d34 → #16C784
}
const acc=(title,open,html)=>`<details ${open?'open':''}><summary>${title}</summary><div class="body">${html}</div></details>`;
const raw=(title,obj)=> level>=2 ? acc('⌁ raw · '+title, false, `<pre>${esc(JSON.stringify(obj,null,2))}</pre>`) : '';
let logTimer=null;
const stateLabel=s=>({running:'<span class="ok">● running</span>',booting:'<span class="warn">● booting…</span>',busy:'<span class="warn">● validating (busy)</span>',down:'<span class="err">● stopped</span>'}[s]||esc(s));
async function loadLog(){
  const pane=document.getElementById('logpane'); if(!pane) return;
  const sel=window.getSelection();   // don't clobber a selection the user is copying
  if(sel && !sel.isCollapsed && pane.contains(sel.anchorNode)) return;
  const r=await fetch('/api/node/log?lines=120').then(r=>r.json()).catch(()=>({ok:false,error:'unreachable'}));
  if(!r.ok){ pane.textContent=r.error||'log unavailable'; return; }
  const atBottom=pane.scrollTop+pane.clientHeight>=pane.scrollHeight-30;
  pane.innerHTML=r.lines.map(l=>{const c=/UpdateTip|new best/.test(l)?'u':/init message|Bitcoin Core|Done loading|Opened|thread start|peer/i.test(l)?'i':/Warning|error|corrupt/i.test(l)?'w':'';return c?`<span class="${c}">${esc(l)}</span>`:esc(l);}).join('\n');
  if(atBottom) pane.scrollTop=pane.scrollHeight;
}
async function nodeAction(act){
  const msg=document.getElementById('nodemsg'); if(msg) msg.textContent=act==='start'?'starting…':'stopping…';
  const r=await fetch('/api/node/'+act,{method:'POST',headers:{'content-type':'application/json'},body:'{}'}).then(r=>r.json()).catch(e=>({ok:false,error:String(e)}));
  if(msg) msg.innerHTML=r.ok?`<span class="ok">${esc(r.note||r.message||act+' ok')}</span>`:`<span class="err">${esc(r.error)}</span>`;
  setTimeout(pollHealth,1500);
}
async function pollSystem(){
  const el=document.getElementById('sysmon'); if(!el) return;
  try{ const d=await fetch('/api/system').then(r=>r.json()); if(!d.ok){el.textContent='🖥 —';return;}
    let col='#16C784'; const t=d.tempC;
    if(t>=99)col='#ff2b2b'; else if(t>=96)col='#FF5E3A'; else if(t>=85)col='#F7931A';
    el.innerHTML=`🖥 ${d.cpuPct}%`+(t!=null?` · <span style="color:${col}">🌡 ${t}°C</span>`:'')+(d.memUsedPct!=null?` · mem ${d.memUsedPct}%`:'');
  }catch{}
}
let NETACT={events:[],tally:{},local:[]};   // last log-based connection activity (also feeds the topology ring)
// numeric display mode for the log panel: human | sci (18 significant digits) | 18dec (exact 18 dp)
let NETFMT=localStorage.getItem('netfmt')||'human';
function setNetFmt(v){NETFMT=v;localStorage.setItem('netfmt',v);render();}
function fmtN(n){
  if(n==null||n==='')return '—'; n=Number(n);
  if(!Number.isFinite(n))return '—';
  if(NETFMT==='sci')return n.toLocaleString()+' (≈'+n.toExponential(18)+')';
  if(NETFMT==='18dec')return n.toLocaleString()+'.'+'0'.repeat(18);   // integers: exact zero tail
  return n.toLocaleString();
}
async function netActivityHtml(){
  try{ const na=await fetch('/api/netactivity?n=40').then(r=>r.json()); if(!na.ok) return ''; NETACT=na;
    const ty=na.tally||{}, col={connected:'#16C784',failed:'#f85149',disconnect:'#F7931A',inbound:'#00BFFF'};
    const rows=(na.events||[]).slice().reverse().map(e=>`<tr><td>${esc((e.time||'').slice(-8))}</td><td style="color:${col[e.kind]||'#c9d4e0'}">${esc(e.kind)}</td><td>${esc(e.addr||(e.peer?'peer='+e.peer:'—'))}</td><td class="muted">${esc((e.text||'').slice(0,70))}</td></tr>`).join('');
    const sel=`<select onchange="setNetFmt(this.value)" style="float:right">`+
      ['human','sci','18dec'].map(m=>`<option value="${m}"${m===NETFMT?' selected':''}>${{human:'human',sci:'scientific',['18dec']:'18-dec exact'}[m]}</option>`).join('')+`</select>`;
    // livePeers = getpeerinfo NOW (authoritative; null = RPC choked). The tally counts log
    // EVENTS over the window — an airgap toggle piles up connect events that are NOT current peers.
    const live=na.livePeers==null?'—':fmtN(na.livePeers);
    return `<h3>Connection activity <span class="muted">· log-based (works during RPC choke)</span>${sel}</h3>`
      +`<div><b style="color:#16C784">● ${live} peers live now</b> <span class="muted">(RPC getpeerinfo — the dashboard truth)</span></div>`
      +`<div class="muted">log window (events, not current peers): ✓ ${fmtN(ty.connected||0)} connects · ✗ ${fmtN(ty.failed||0)} failed · ⟲ ${fmtN(ty.disconnect||0)} dropped · ⇣ ${fmtN(ty.inbound||0)} inbound${na.local&&na.local.length?' · local: '+na.local.slice(0,3).join(', '):''}</div>`
      +(NETFMT==='human'?'':`<div class="muted">decimals acknowledged: SAT 8 dp (₿ native) · USDC 6 dp · EVM 18 dp — exact, never float · sync % is 4 dp by design</div>`)
      +`<div class="scroll"><table><thead><tr><th>time</th><th>event</th><th>addr/peer</th><th>detail</th></tr></thead><tbody>${rows||'<tr><td colspan=4 class="muted">—</td></tr>'}</tbody></table></div>`;
  }catch{ return ''; }
}
async function pollCoremon(){
  const el=document.getElementById('coremon'); if(!el) return;
  try{ const m=await fetch('/api/coremon?node='+node()).then(r=>r.json());
    if(!m.up){ el.className='coremon off'; el.textContent='● CORE OFF'; el.title='Bitcoin Core not reachable on :'+(m.port||'8332'); }
    else if(m.feeding){ el.className='coremon on feeding'; el.textContent='● CORE ON'; el.title=`Bitcoin Core ON · feeding from connect (block ${m.height}, tip ${m.logAgeSec}s ago)`; }
    else { el.className='coremon on'; el.textContent='● CORE ON'; el.title=`Bitcoin Core ON (block ${m.height||'?'})`; }
  }catch{ el.className='coremon off'; el.textContent='● CORE ?'; el.title='monitor error'; }
}
async function pollHealth(){
  const pill=document.getElementById('nodestat'); if(!pill) return;
  try{ const h=await fetch('/api/health?node='+node()).then(r=>r.json());
    pill.className='nodestat '+h.state;
    pill.textContent={running:`● node :${h.port} · block ${h.blocks!=null?Number(h.blocks).toLocaleString():'?'}`,booting:`● node :${h.port} booting…`,busy:`● node :${h.port} validating…`,down:`● node :${h.port||'8332'} stopped`}[h.state]||('● '+h.state);
  }catch{ pill.className='nodestat down'; pill.textContent='● node unreachable'; }
}
// ---- Logs tab + live-peer correlation ------------------------------------------------------
// Two labeled truths everywhere: livePeers = getpeerinfo NOW (the actual set, null when RPC is
// choked — never a false 0); the log tally = connect/disconnect EVENTS over a window.
const LOGS={mode:'live',tick:0};
let logsTimer=null, PEERSLIVE=null;
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const logCls=l=>/UpdateTip|new best/.test(l)?'u':/Warning|error|corrupt|fatal/i.test(l)?'w':/peer|connect|disconnect|socket|addrman/i.test(l)?'i':'';
function paintLog(pane,lines,q,isRe){
  const hi=q&&!isRe?new RegExp(escRe(esc(q)),'gi'):null;
  const atBottom=pane.scrollTop+pane.clientHeight>=pane.scrollHeight-30;
  pane.innerHTML=lines.map(l=>{let t=esc(l); if(hi)t=t.replace(hi,m=>'<mark>'+m+'</mark>'); const c=logCls(l); return c?`<span class="${c}">${t}</span>`:t;}).join('\n')||'<span class="muted">(no lines)</span>';
  if(atBottom)pane.scrollTop=pane.scrollHeight;
}
const LOGSEV={peers:/peer|connect|disconnect|socket|addrman|dns|Bound to|AddLocal/i,tip:/UpdateTip|new best|Saw new/i,warn:/warning|error|corrupt|fatal/i};
async function refreshLogs(){
  const pane=document.getElementById('llog'); if(!pane||cur!=='logs')return;
  const sel=window.getSelection();   // don't clobber a selection the user is copying
  if(sel&&!sel.isCollapsed&&pane.contains(sel.anchorNode))return;
  const n=+document.getElementById('lln').value||400, sv=document.getElementById('lsev').value;
  const r=await fetch('/api/node/log?lines='+n).then(r=>r.json()).catch(()=>({ok:false,error:'unreachable'}));
  if(!r.ok){pane.textContent=r.error||'log unavailable';return;}
  const lines=LOGSEV[sv]?r.lines.filter(l=>LOGSEV[sv].test(l)):r.lines;
  paintLog(pane,lines,null,false);
  const st=document.getElementById('lstat');
  if(st)st.innerHTML=`<span style="color:var(--btc)">● live tail</span> · ${fmt(lines.length)}${LOGSEV[sv]?' of '+fmt(r.lines.length):''} lines · updated ${new Date().toLocaleTimeString()}`;
}
async function searchLogs(){
  const pane=document.getElementById('llog'),q=document.getElementById('lq').value.trim();
  if(!q)return setLogsLive();
  LOGS.mode='search';
  const isRe=document.getElementById('lre').checked;
  const st=document.getElementById('lstat'); if(st)st.textContent='searching the whole debug.log…';
  const r=await fetch('/api/log/search?q='+encodeURIComponent(q)+'&n=800'+(isRe?'&regex=1':'')).then(r=>r.json()).catch(e=>({ok:false,error:String(e)}));
  if(!r.ok){if(st)st.innerHTML='<span class="err">'+esc(r.error||'search failed')+'</span>';return;}
  paintLog(pane,r.lines,q,isRe);
  pane.scrollTop=pane.scrollHeight;

    const loadSet=async()=>{try{const s=await fetch('/api/settings').then(r=>r.json());showSet(s.settings);}catch{}};
    el.querySelector('#rage').onchange=e=>{el.querySelector('#rin').value=e.target.checked?32:4;el.querySelector('#rds').value=e.target.checked?3:12;};
    el.querySelector('#rapply').onclick=async()=>{const body={rage:el.querySelector('#rage').checked,maxInflight:+el.querySelector('#rin').value,distressMs:(+el.querySelector('#rds').value)*1000};
      el.querySelector('#rset').textContent='applying…';try{const s=await fetch('/api/settings',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());showSet(s.settings);}catch(e){el.querySelector('#rset').textContent='error: '+esc(e.message);}};
    el.querySelector('#rhand').onclick=async()=>{const o=el.querySelector('#rhout');o.textContent='handing off to rage.pythai.net…';
      try{const r=await fetch('/api/rage/handoff',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({count:500})}).then(r=>r.json());
        o.innerHTML=r.ok?`<span style="color:#16C784">✓ gathered ${r.gathered} nodes → ${esc(r.target)} (HTTP ${r.push.status})</span>`
          :`<span class="err">✗ ${esc(r.error||(r.push&&r.push.response)||'failed')}${r.gathered!=null?' (gathered '+r.gathered+')':''}</span>`;}
      catch(e){o.innerHTML='<span class="err">'+esc(e.message)+'</span>';}};
    loadSet(); setInterval(loadSet,3000);
  },
  async monitor(){
    const el=$('#p-monitor'); if(el.dataset.init)return; el.dataset.init=1;
    const list=await fetch('/api/monitor').then(r=>r.json()).catch(()=>({commands:{}}));
    const cmds=list.commands||{};
    el.innerHTML=`<h3>Node Monitor <span class="muted">· bitcoin-cli + debug.log · read-only · click a command</span></h3>
      <div id="mbtns" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px"></div>
      <div class="row" style="gap:6px;margin-bottom:6px"><button id="mall" class="secondary">▶ Run all (snapshot)</button><span class="muted" id="mcmd" style="font-family:monospace;align-self:center"></span></div>
      <pre id="mout" style="min-height:260px;max-height:62vh;overflow:auto">// click a command above to run it</pre>`;
    const out=el.querySelector('#mout'), cmdlbl=el.querySelector('#mcmd');
    const run=async(k,label)=>{ cmdlbl.textContent='running '+label+'…'; out.textContent='running…';
      try{ const r=await fetch('/api/monitor',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({cmd:k})}).then(r=>r.json());
        out.textContent=r.ok?(r.output||'(no output)'):('error: '+(r.error||'failed')); cmdlbl.innerHTML='<span class="muted">$ '+esc(r.cmd||label)+'</span>'; }
      catch(e){ out.textContent='error: '+e.message; } };
    const bw=el.querySelector('#mbtns');
    for(const [k,label] of Object.entries(cmds)){ const b=document.createElement('button'); b.textContent=label; b.className='secondary'; b.onclick=()=>run(k,label); bw.appendChild(b); }
    el.querySelector('#mall').onclick=async()=>{ out.textContent=''; cmdlbl.textContent='running all…';
      for(const [k,label] of Object.entries(cmds)){ try{ const r=await fetch('/api/monitor',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({cmd:k})}).then(r=>r.json()); out.textContent+=`\n━━ ${label} ━━\n${r.output||''}\n`; out.scrollTop=out.scrollHeight; }catch(e){} } cmdlbl.textContent='snapshot complete'; };
  },
};
// global runner for Reference tab buttons
window.__run=async(method,inId,outId)=>{const out=document.getElementById(outId);out.style.display='block';out.textContent='running…';
  let p=[];try{const v=document.getElementById(inId).value.trim();p=v?JSON.parse(v):[];}catch{out.textContent='params must be valid JSON';return;}
  try{const r=await rpc(method,p);out.textContent=JSON.stringify(r,null,2);}catch(e){out.innerHTML='<span class="err">'+esc(e.message)+'</span>';}};
$('#refresh').onclick=render; $('#node').onchange=()=>{document.querySelectorAll('.panel').forEach(p=>delete p.dataset.init);render();};
const LIVE=['overview','node','blocks','mempool','network','indexes','oracle'];
function applyRate(){ clearInterval(timer); const ms=Number($('#rate').value); if(ms>0) timer=setInterval(()=>{ if(LIVE.includes(cur)) render(); }, ms); }
$('#rate').onchange=()=>{ applyRate(); render(); };   // change rate → refresh now, then on schedule
$('#node').addEventListener('change',pollHealth);
render(); applyRate(); pollHealth(); setInterval(pollHealth,4000);
pollCoremon(); setInterval(pollCoremon,5000);
pollSystem(); setInterval(pollSystem,5000);
setInterval(pollPeers,5000);   // Overview "peers — actual" real-time updates
setInterval(()=>{ if(cur==='overview') refreshOvLog(); },4000);   // Overview log widget live tail
$('#node').addEventListener('change',pollCoremon);
</script>
